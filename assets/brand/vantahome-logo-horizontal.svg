<svg width="1800" height="520" viewBox="0 0 1800 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vantahome horizontal logo</title>
  <desc id="desc">Vantahome smart-home logo with a futuristic house and V mark beside the VANTAHOME wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="80" y1="70" x2="430" y2="455" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3C7FF"/>
      <stop offset="0.32" stop-color="#A855F7"/>
      <stop offset="0.7" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="word" x1="595" y1="190" x2="1595" y2="333" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8B4FE"/>
      <stop offset="0.42" stop-color="#A855F7"/>
      <stop offset="0.68" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.48 0 0 0 0 0.16 0 0 0 0 1 0 0 0 0.72 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1800" height="520" fill="#050612"/>

  <g transform="translate(82 48) scale(.42)" filter="url(#glow)">
    <path d="M177 478L512 168L847 478H735L512 272L289 478H177Z" fill="url(#mark)" stroke="#F5D0FE" stroke-width="8" stroke-linejoin="round"/>
    <path d="M674 260H744V432L674 367V260Z" fill="url(#mark)" stroke="#F5D0FE" stroke-width="7" stroke-linejoin="round"/>
    <path d="M245 510H346L512 746L678 510H779V785H642V692L522 866H502L382 692V785H245V510Z" fill="#0B0920" stroke="#A78BFA" stroke-width="8" stroke-linejoin="round" opacity="0.95"/>
    <path d="M304 522H405L512 704L619 522H720L534 846H490L304 522Z" fill="url(#mark)" stroke="#F5D0FE" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <g transform="translate(82 48) scale(.42)" filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 520V343" stroke="#C084FC" stroke-width="8"/>
    <path d="M512 520L392 423" stroke="#C084FC" stroke-width="8"/>
    <path d="M512 520L632 423" stroke="#C084FC" stroke-width="8"/>
    <path d="M512 520V681" stroke="#C084FC" stroke-width="8"/>
    <circle cx="512" cy="520" r="62" fill="#130B2D" stroke="#F5D0FE" stroke-width="10"/>
    <circle cx="512" cy="520" r="34" fill="#F8D7FF"/>
    <circle cx="512" cy="343" r="15" fill="#F8D7FF" stroke="#A855F7" stroke-width="8"/>
    <circle cx="392" cy="423" r="15" fill="#F8D7FF" stroke="#A855F7" stroke-width="8"/>
    <circle cx="632" cy="423" r="15" fill="#F8D7FF" stroke="#A855F7" stroke-width="8"/>
    <circle cx="512" cy="681" r="15" fill="#F8D7FF" stroke="#A855F7" stroke-width="8"/>
  </g>

  <text x="540" y="312" fill="url(#word)" font-family="Avenir Next, Montserrat, Inter, Arial, sans-serif" font-size="118" font-weight="700" letter-spacing="18">VANTAHOME</text>
  <circle cx="1298" cy="272" r="10" fill="#38BDF8" opacity="0.95" filter="url(#soft)"/>
</svg>
