# Mosquitto bridge template for HiveMQ Cloud.
# Fill placeholders and copy to:
#   /opt/homebrew/etc/mosquitto/conf.d/bridge.conf

connection hivemq-cloud
address <cluster-host>:8883
bridge_protocol_version mqttv311
remote_username <username>
remote_password <password>
bridge_cafile /etc/ssl/cert.pem
try_private false

# Bi-directional topic sync
# (adjust the prefix if you change EXPO_PUBLIC_MQTT_TOPIC_* in .env)
topic vantahome/# both 0
