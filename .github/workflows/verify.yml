name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

# Verification never needs repository write access or deployment secrets.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types-and-tests:
    name: TypeScript and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan tracked files and history for secrets
        run: npm run security:secrets

      - name: Verify app, Edge Functions, and tests
        run: npm run verify

      - name: Build production web export
        run: npm run build
